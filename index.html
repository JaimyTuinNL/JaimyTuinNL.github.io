<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page not found</title>
    <link rel="icon" type="image/x-icon" href="https://spud.jaimytuin.com/media/logos/spud.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
    <link rel="stylesheet" href="/css/temp.css">
    <style>
        body {
            color: #fff;
        }

        main {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;
            text-align: center;

            height: 100vh;
        }

        img {
            width: 200px;
            margin-bottom: 30px;

            -webkit-user-drag: none;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }

        main>h1 {
            margin: 0;
        }
    </style>
</head>

<body>
    <main>
        <img src="https://spud.jaimytuin.com/media/chars/sadJaapie.png" alt="sad cockatiel bird cartoon">
        <h1>The requested page could not be found</h1>
        <p>You will be redirected to the main page shortly..</p>
    </main>
    <script>
        function redirect() {
            setTimeout(() => {
                window.location.href = '/';
            }, 5000);
        }

        window.onload = redirect;
    </script>
</body>
</html>
